[project]
name = "coursework"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
    "requests (==2.34.2)",
    "python-dotenv (==1.2.3)",
    "pytest (==9.1.1)",
    "black (==26.5.1)",
    "certifi (==2026.7.22)",
    "click (==8.5.0)",
    "colorama (==0.4.6)",
    "coverage (==7.16.0)",
    "flake8 (==7.3.0)",
    "idna (==3.19)",
    "iniconfig (==2.3.0)",
    "isort (==9.0.1)",
    "mccabe (==0.7.0)",
    "mypy (==2.3.1)",
    "mypy-extensions (==1.1.0)",
    "packaging (==26.3)",
    "pathspec (==1.1.1)",
    "pluggy (==1.6.0)",
    "pycodestyle (==2.14.0)",
    "pyflakes (==3.4.0)",
    "pygments (==2.21.0)",
    "pytest-cov (==7.1.0)",
    "typing-extensions (==4.16.0)",
    "urllib3 (==2.7.0)",
    "ast-serialize (==0.9.0)",
    "charset-normalizer (==3.5.1)",
    "librt (==0.15.0)",
    "platformdirs (==4.11.7)",
    "pytokens (==0.4.1)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''(
  /(
    \.git
  )/
)
'''

[tool.isort]
line_length = 119
force_single_line = true

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'

[dependency-groups]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]
lint = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)"
]
